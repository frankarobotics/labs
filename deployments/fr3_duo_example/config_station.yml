metadata:
  station_id: fr3_duo_example

embodiment:
  teleop_robots:
    - id: left_arm
      type: TELEOP_ROBOT
      config:
        namespace: left
        ros_message_type: sensor_msgs/JointState
        leader_topic: leader/gello/joint_states
        leader_device: franka_gello
        follower_topic: follower/gello/joint_states
        follower_device: franka_fr3

    - id: left_gripper
      type: TELEOP_ROBOT
      config:
        namespace: left
        ros_message_type: std_msgs/Float32
        leader_topic: leader/gripper/gripper_client/target_gripper_width_percent
        leader_device: franka_gello
        follower_topic: follower/gripper/gripper_client/target_gripper_width_percent
        follower_device: robotiq_2f_85

    - id: right_arm
      type: TELEOP_ROBOT
      config:
        namespace: right
        ros_message_type: sensor_msgs/JointState
        leader_topic: leader/gello/joint_states
        leader_device: franka_gello
        follower_topic: follower/gello/joint_states
        follower_device: franka_fr3

    - id: right_gripper
      type: TELEOP_ROBOT
      config:
        namespace: right
        ros_message_type: std_msgs/Float32
        leader_topic: leader/gripper/gripper_client/target_gripper_width_percent
        leader_device: franka_gello
        follower_topic: follower/gripper/gripper_client/target_gripper_width_percent
        follower_device: robotiq_2f_85

  observer_devices:
    - id: head
      type: ZED_CAMERA
      config:
        rgb:
          topic: /head_camera/zed_node/rgb/image_rect_color
        info:
          topic: /head_camera/zed_node/rgb/camera_info

    - id: wrist_left
      type: REALSENSE_CAMERA
      config:
        rgb:
          topic: /wrist_camera_left/camera/color/image_raw
        info:
          topic: /wrist_camera_left/camera/color/camera_info

    - id: wrist_right
      type: REALSENSE_CAMERA
      config:
        rgb:
          topic: /wrist_camera_right/camera/color/image_raw
        info:
          topic: /wrist_camera_right/camera/color/camera_info

    - id: franka_robot_left
      type: ROBOT_OBSERVER
      config:
        topics:
          - /left/franka_robot_state_broadcaster/measured_joint_states
          - /left/follower/gripper/joint_states
          - /left/franka_robot_state_broadcaster/external_joint_torques
          - /left/franka_robot_state_broadcaster/external_wrench_in_stiffness_frame

    - id: franka_robot_right
      type: ROBOT_OBSERVER
      config:
        topics:
          - /right/franka_robot_state_broadcaster/measured_joint_states
          - /right/follower/gripper/joint_states
          - /right/franka_robot_state_broadcaster/external_joint_torques
          - /right/franka_robot_state_broadcaster/external_wrench_in_stiffness_frame

  # Topics bound to no device: recorded as-is, never mapped into a dataset.
  # Add USER_TOPICS entries for anything else you want in the recordings.
  other_topics:
    - id: ros_infra
      type: ROS_INFRA
      config:
        topics:
          - /parameter_events
          - /rosout
          - /tf
          - /tf_static
