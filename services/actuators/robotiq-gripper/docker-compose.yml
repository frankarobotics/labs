services:
  robotiq-gripper:
    image: ${DOCKER_REGISTRY:-registry.localhost}/labs/robotiq-gripper:${DOCKER_TAG:-latest}
    build:
      context: .
      dockerfile: robotiq-gripper.dockerfile
      target: ${BUILD_TARGET:-dev}
      args:
        BUILD_TARGET: ${BUILD_TARGET:-dev}
        BUILD_CREATED: ${BUILD_CREATED:-}
        BUILD_VERSION: ${BUILD_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: robotiq-gripper
    network_mode: host
    restart: unless-stopped
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /dev/serial/by-id:/dev/serial/by-id
