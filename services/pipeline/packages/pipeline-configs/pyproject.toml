[project]
name = "pipeline-configs"
version = "0.1.0"
description = "Shared config models for the pipeline services (station, ...)."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.7",
    "pydantic-yaml>=1.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_configs"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
lint.select = [
    "F",   # Pyflakes (F) - Detects various errors
    "E",   # pycodestyle (E, W) - PEP 8 style guide enforcement
    "W",   # pycodestyle (E, W) - PEP 8 style guide enforcement
    "B",   # flake8-bugbear (B) - Finds likely bugs and design problems
    "A",   # flake8-builtins (A) - Checks for python builtins being used as variables or parameters
    "I",   # isort (I) - Import sorting
    "N",   # pep8-naming (N) - PEP 8 naming conventions
    "UP",  # pyupgrade (UP) - Automatically upgrade syntax for newer Python versions
    "C4",  # flake8-comprehensions (C4) - Better comprehensions
    "SIM", # flake8-simplify (SIM) - Simplifies code
    "ERA", # eradicate (ERA) - Finds commented out code
    "Q",   # flake8-quotes (Q) - Checks quotes consistency
    "S",   # flake8-bandit (S) - Finds security issues
    "ANN", # flake8-annotations (ANN) - Type annotation checks
    "D",   # pydocstyle (D) - Docstring style checking
    "RUF", # Ruff-specific rules (RUF)
    "RET", # Return (RET) - Checks return statements
    "PL",  # Pylint (PL) - Pylint checks
    "C90", # mccabe (C90) - Code complexity checks
]
lint.ignore = [
    "B008", # B008: Do not perform function calls in argument defaults (needed for FastAPI dependency injection)
    "D100", # D100: Missing docstring in public module (handled by pydocstyle)
]
exclude = [
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "__pycache__",
    "src/inference_pb2.*",
]

# Configure rule-specific settings
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/*.py" = [
    "ERA001", # Allow commented out code
]
"tests/**/*.py" = [
    "D",       # No need for docstrings in tests
    "PLR2004", # Allow magic value comparison in tests
    "S101",    # Use asserts in tests
    "ANN",     # No need for type annotations in tests
    "PLC0415", # Allow local imports in tests
]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py files
