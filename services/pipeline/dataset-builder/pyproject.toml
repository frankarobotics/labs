[project]
name = "dataset-builder"
version = "0.1.0"
description = "Dataset Builder"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "loguru>=0.7.3",
    "mcap-protobuf-support>=0.5.0",
    "mcap-ros2-support>=0.5.0",
    "mcap>=1.3.0",
    "numpy>=2.3.3",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.2",
    "pipeline-configs",
    "pyarrow>=18.0.0",
    "pydantic>=2.11.8",
    "pyyaml>=6.0.2",
    "scipy>=1.16.2",
]

[tool.uv.sources]
pipeline-configs = { path = "../packages/pipeline-configs", editable = true }

[dependency-groups]
dev = [
    "debugpy>=1.8.17",
    "mypy>=1.17.1",
    "pandas-stubs>=2.3.2.250827",
    "pytest-cov>=6.2.1",
    "pytest>=8.4.1",
    "ruff>=0.12.9",
    "scipy-stubs>=1.16.2.0",
    "types-protobuf>=6.30.2.20250914",
    "types-PyYAML>=6.0.12",
]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
exclude = '''
  ^(.venv|.mypy_cache|.ruff_cache|build|dist|__pycache__|node_modules)
'''

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--exitfirst --tb=long --showlocals --cov=src --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
target-version = "py312"
line-length = 120
lint.select = [
    "F",
    "E",
    "W",
    "B",
    "A",
    "I",
    "N",
    "UP",
    "C4",
    "SIM",
    "ERA",
    "Q",
    "S",
    "ANN",
    "D",
    "RUF",
    "RET",
    "PL",
    "C90",
]
lint.ignore = [
    "D100",
]
exclude = [
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "__pycache__",
    "node_modules",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/*.py" = [
    "ERA001",
]
"tests/**/*.py" = [
    "D",
    "PLR2004",
    "S101",
]
"__init__.py" = ["F401"]
